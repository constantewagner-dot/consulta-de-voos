<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Consulta de Voos v8</title>
    <style>
        :root {
            --bg:#f0f2f5; --card:#fff; --border:#e0e0e0; --text:#1a1a2e; --sub:#666;
            --primary:#1a73e8; --success:#0d8a3e; --danger:#d93025; --warning:#e67e22;
            --purple:#6B2D8B; --radius:12px; --shadow:0 2px 12px rgba(0,0,0,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
        .header { background:linear-gradient(135deg,#1a1a2e,#16213e); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; box-shadow:0 2px 16px rgba(0,0,0,0.15); position:sticky; top:0; z-index:100; }
        .brand { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .brand h1 { font-size:1.3rem; font-weight:700; margin:0; white-space:nowrap; }
        .brand span { color:#4fc3f7; }
        .api-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .api-key-wrap { display:flex; align-items:center; gap:6px; }
        .api-key-wrap input { padding:6px 10px; border-radius:6px; border:1px solid #ffffff44; background:#ffffff11; color:#fff; font-size:0.78rem; width:210px; outline:none; font-family:monospace; }
        .api-key-wrap input::placeholder { color:#ffffff66; }
        .api-key-wrap input:focus { border-color:#4fc3f7; }
        .btn-sm { padding:6px 12px; border-radius:6px; border:none; cursor:pointer; font-size:0.72rem; font-weight:600; white-space:nowrap; transition:all 0.2s; }
        .btn-sm.ghost { background:#ffffff22; color:#fff; }
        .btn-sm.ghost:hover { background:#ffffff44; }
        .api-status { font-size:0.7rem; white-space:nowrap; padding:4px 12px; border-radius:20px; background:#ffffff15; }

        /* ── Layout com sidebar ── */
        .main { max-width:1320px; margin:0 auto; padding:18px 16px 40px; }
        .layout { display:flex; gap:16px; align-items:flex-start; }
        .sidebar { flex:0 0 300px; position:sticky; top:76px; }
        .sidebar-inner { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
        .sidebar h3 { font-size:0.95rem; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
        .sidebar .sel-count { margin-left:auto; font-size:0.7rem; background:#eef2ff; color:var(--primary); padding:2px 9px; border-radius:12px; font-weight:700; }
        .sidebar-empty { color:#aaa; font-size:0.8rem; text-align:center; padding:24px 10px; line-height:1.5; }
        .sel-card { border:2px solid #eef2ff; border-radius:10px; padding:10px 12px; margin-bottom:10px; position:relative; }
        .sel-card.selected-ida { border-color:#bbdefb; background:#f7fbff; }
        .sel-card.selected-volta { border-color:#f8bbd0; background:#fff8fa; }
        .sel-card .sel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
        .sel-card .sel-dir { font-weight:700; font-size:0.72rem; letter-spacing:0.4px; text-transform:uppercase; }
        .sel-card .sel-dir.ida { color:#1565c0; }
        .sel-card .sel-dir.volta { color:#c62828; }
        .sel-card .sel-remove { background:none; border:none; font-size:1.1rem; color:#bbb; cursor:pointer; padding:2px 6px; border-radius:6px; line-height:1; }
        .sel-card .sel-remove:hover { background:#f0f0f0; color:#555; }
        .sel-card .sel-route { font-weight:700; font-size:0.88rem; margin-bottom:3px; }
        .sel-card .sel-times { color:var(--sub); font-size:0.75rem; margin-bottom:5px; }
        .sel-card .sel-tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
        .sel-card .sel-price { font-size:1.12rem; font-weight:800; color:#0d8a3e; }
        .sel-card .sel-points { font-size:0.88rem; font-weight:700; color:#6B2D8B; }
        .sidebar-total { display:none; justify-content:space-between; align-items:center; border-top:2px solid #f0f0f0; margin-top:12px; padding-top:12px; }
        .sidebar-total.visible { display:flex; }
        .sidebar-total span { font-size:0.78rem; color:var(--sub); font-weight:600; }
        .sidebar-total strong { font-size:1.3rem; font-weight:800; color:#0d8a3e; }
        .sidebar .btn-whatsapp { width:100%; margin-top:12px; }
        .content { flex:1; min-width:0; }

        .toggles-row { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
        .toggle-group { display:flex; gap:0; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
        .toggle-btn { padding:9px 20px; border:none; background:transparent; cursor:pointer; font-size:0.82rem; font-weight:600; color:var(--sub); transition:all 0.2s; white-space:nowrap; }
        .toggle-btn.active { background:var(--primary); color:#fff; box-shadow:0 2px 6px rgba(26,115,232,0.3); }
        .toggle-btn:hover:not(.active) { background:#f5f7fa; color:var(--text); }

        /* ── Filtros de busca (acima do formulário) ── */
        .filters-card { background:var(--card); border-radius:var(--radius); padding:16px 20px; box-shadow:var(--shadow); margin-bottom:14px; }
        .filters-title { font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.6px; color:#999; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
        .filters-grid { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
        .filter-group { display:flex; gap:0; background:#f5f7fa; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
        .filter-btn { padding:8px 16px; border:none; background:transparent; cursor:pointer; font-size:0.78rem; font-weight:600; color:var(--sub); transition:all 0.2s; white-space:nowrap; }
        .filter-btn.active { background:var(--purple); color:#fff; }
        .filter-btn:hover:not(.active) { background:#ede7f6; }
        .airline-toggles { display:flex; gap:6px; flex-wrap:wrap; }
        .airline-chip { padding:6px 14px; border:2px solid var(--border); border-radius:20px; background:var(--card); cursor:pointer; font-size:0.76rem; font-weight:600; display:flex; align-items:center; gap:5px; transition:all 0.2s; white-space:nowrap; }
        .airline-chip.active { border-color:#333; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
        .airline-chip.incompatible { opacity:0.3; cursor:not-allowed; text-decoration:line-through; }
        .airline-chip .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

        .search-card { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:12px; }
        .search-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
        .search-field { display:flex; flex-direction:column; gap:4px; flex:1; min-width:115px; }
        .search-field label { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--sub); }
        .search-field input,.search-field select { padding:9px 11px; border:2px solid var(--border); border-radius:8px; font-size:0.9rem; outline:none; transition:border-color 0.2s; background:#fafafa; font-family:inherit; }
        .search-field input:focus,.search-field select:focus { border-color:var(--primary); background:#fff; }
        .search-field.pax { flex:0.45; min-width:75px; }
        .search-field.pax-sm { flex:0.35; min-width:60px; }
        .btn-search { padding:10px 26px; background:var(--success); color:#fff; border:none; border-radius:8px; font-size:0.92rem; font-weight:700; cursor:pointer; transition:all 0.2s; white-space:nowrap; align-self:flex-end; min-height:42px; }
        .btn-search:hover:not(:disabled) { background:#0b7532; transform:translateY(-1px); box-shadow:0 4px 12px rgba(13,138,62,0.3); }
        .btn-search:disabled { background:#aaa; cursor:not-allowed; }
        .airport-box { position:relative; }
        .airport-input-wrap { position:relative; }
        .airport-input-wrap input { width:100%; padding-right:30px; }
        .airport-input-wrap .clear-btn { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:1.2rem; color:#bbb; cursor:pointer; padding:4px; display:none; line-height:1; }
        .airport-input-wrap.has-value .clear-btn { display:block; }
        .airport-input-wrap .clear-btn:hover { color:#555; }
        .airport-dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:2px solid #ddd; border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,0.14); max-height:320px; overflow-y:auto; z-index:50; display:none; }
        .airport-dropdown.show { display:block; }
        .airport-dropdown-header { padding:9px 14px; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:#888; border-bottom:1px solid #f0f0f0; background:#fafafa; position:sticky; top:0; }
        .airport-item { padding:9px 14px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:background 0.1s; }
        .airport-item:hover { background:#eef2ff; }
        .airport-item .iata { font-weight:800; font-size:0.95rem; color:var(--primary); min-width:40px; }
        .airport-item .info .city { font-weight:600; font-size:0.85rem; }
        .airport-item .info .name { font-size:0.7rem; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .airport-dropdown .no-results { padding:22px; text-align:center; color:#aaa; font-size:0.8rem; }
        .status-bar { text-align:center; font-size:0.76rem; padding:6px; color:var(--sub); min-height:26px; margin-bottom:4px; }
        .cache-badge { text-align:center; font-size:0.74rem; padding:6px 12px; margin-bottom:6px; border-radius:8px; display:none; }
        .cache-badge.show { display:block; }
        .cache-badge.cached { background:#fff8e1; color:#795548; border:1px solid #ffe082; }
        .cache-badge.fresh { background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; }
        .btn-refresh { background:none; border:1px solid currentColor; border-radius:6px; padding:2px 10px; margin-left:8px; cursor:pointer; font-size:0.7rem; font-weight:600; }
        .btn-refresh:hover { opacity:0.7; }
        .loading-box { display:none; text-align:center; padding:40px; }
        .loading-box.show { display:block; }
        .spinner { width:42px; height:42px; border:4px solid #e0e0e0; border-top-color:var(--primary); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 12px; }
        @keyframes spin { to{transform:rotate(360deg);} }
        .loading-text { color:#666; font-size:0.85rem; }
        .results-section { display:none; }
        .results-section.visible { display:block; }
        .trip-columns { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .trip-columns.single-col { grid-template-columns:1fr; }
        .trip-col { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
        .trip-col-header { padding:11px 16px; font-weight:700; font-size:0.88rem; display:flex; align-items:center; gap:8px; border-bottom:2px solid #f0f0f0; }
        .trip-col-header.ida { background:#e3f2fd; color:#1565c0; }
        .trip-col-header.volta { background:#fce4ec; color:#c62828; }
        .trip-col-body { max-height:640px; overflow-y:auto; padding:6px; }
        .empty-msg { text-align:center; padding:40px 20px; color:#999; font-size:0.82rem; }
        .err-card { background:#fffbe6; margin:6px; padding:8px 12px; border-radius:8px; font-size:0.7rem; color:#795548; border-left:3px solid var(--warning); }
        .flight-card { border:2px solid #f0f0f0; border-radius:10px; padding:13px 15px 13px 14px; margin:5px; cursor:pointer; transition:all 0.2s; position:relative; background:#fff; }
        .flight-card:hover { border-color:#ccc; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .flight-card.picked { border-color:var(--success); background:#f6fff6; box-shadow:0 0 0 2px rgba(13,138,62,0.12); }
        .flight-card .radio-dot { position:absolute; top:15px; right:14px; width:18px; height:18px; border-radius:50%; border:2px solid #ccc; background:#fff; }
        .flight-card.picked .radio-dot { border-color:var(--success); background:var(--success); box-shadow:inset 0 0 0 3px #fff; }
        .flight-card .top-line { display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
        .flight-card .op-tag { display:inline-block; padding:3px 11px; border-radius:14px; font-size:0.7rem; font-weight:700; color:#fff; }
        .flight-card .src-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.58rem; font-weight:600; background:#f0f0f0; color:#777; }
        .cabin-tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:0.6rem; font-weight:700; background:#fff3e0; color:#e65100; }
        .flight-card .route { font-weight:700; font-size:1.02rem; margin-bottom:7px; }
        .best-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px; }
        .best-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:8px; font-size:0.78rem; font-weight:700; }
        .best-chip.money { background:#e8f5e9; color:#0d8a3e; border:1px solid #a5d6a7; }
        .best-chip.points { background:#ede7f6; color:#6B2D8B; border:1px solid #d1c4e9; }
        .best-chip .lbl { font-weight:600; font-size:0.68rem; opacity:0.8; }
        .flight-card .times { color:var(--sub); font-size:0.82rem; margin-bottom:5px; }
        .flight-card .tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
        .badge { padding:2px 9px; border-radius:10px; font-size:0.66rem; font-weight:600; }
        .badge-direct { background:#e8f5e9; color:#0d8a3e; }
        .badge-stops { background:#fff3e0; color:#e67e22; }
        .badge-flight { background:#e3f2fd; color:#1565c0; }
        .badge-fare { background:#ede7f6; color:#6B2D8B; }
        .flight-card .prices { display:flex; align-items:center; gap:10px; margin-top:9px; flex-wrap:wrap; }
        .price-money { font-size:1.3rem; font-weight:800; color:#0d8a3e; }
        .price-points { font-size:0.88rem; font-weight:700; color:#6B2D8B; }
        .price-tax { font-size:0.68rem; color:#c62828; font-weight:600; }
        .fare-table { width:100%; border-collapse:collapse; margin-top:7px; font-size:0.73rem; }
        .fare-table th { font-size:0.62rem; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; color:#888; padding:3px 7px; text-align:left; border-bottom:1px solid #eee; background:#fafafa; }
        .fare-table td { padding:4px 7px; border-bottom:1px solid #f5f5f5; font-size:0.76rem; }
        .fare-table .best-fare { background:#e8f5e9; font-weight:700; }
        .btn-whatsapp { padding:10px 22px; background:#25D366; color:#fff; border:none; border-radius:8px; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
        .btn-whatsapp:hover:not(:disabled) { background:#1ebe5b; transform:translateY(-1px); box-shadow:0 4px 10px rgba(37,211,102,0.3); }
        .btn-whatsapp:disabled { background:#bbb; cursor:not-allowed; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; align-items:center; justify-content:center; }
        .modal-overlay.show { display:flex; }
        .modal-box { background:#fff; border-radius:var(--radius); padding:24px; max-width:520px; width:92%; box-shadow:0 20px 60px rgba(0,0,0,0.25); max-height:90vh; overflow-y:auto; }
        .modal-box h3 { margin-bottom:8px; font-size:1.1rem; }
        .modal-box .msg-preview { background:#f5f5f5; border-radius:8px; padding:12px; font-size:0.8rem; line-height:1.6; white-space:pre-wrap; font-family:inherit; max-height:260px; overflow-y:auto; margin-bottom:14px; border:1px solid #e0e0e0; }
        .modal-btns { display:flex; gap:8px; flex-wrap:wrap; }
        .modal-btns button,.modal-btns a { padding:9px 16px; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:0.8rem; text-decoration:none; display:inline-block; text-align:center; }
        .btn-copy { background:#333; color:#fff; }
        .btn-send-wa { background:#25D366; color:#fff; }
        .btn-close { background:#eee; color:#333; }
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 22px; border-radius:8px; font-weight:600; font-size:0.8rem; z-index:300; opacity:0; transition:opacity 0.3s; pointer-events:none; }
        .toast.on { opacity:1; }
        .debug-toggle { background:none; border:1px dashed #ccc; color:#999; padding:4px 12px; border-radius:6px; font-size:0.65rem; cursor:pointer; margin-top:8px; }
        .debug-toggle:hover { border-color:#888; color:#666; }
        .debug-panel { background:#1a1a2e; color:#4fc3f7; font-family:'Consolas','Monaco',monospace; font-size:0.7rem; padding:10px 16px; border-radius:8px; margin-top:8px; max-height:240px; overflow-y:auto; display:none; white-space:pre-wrap; word-break:break-all; }
        .debug-panel.on { display:block; }

        @media(max-width:1000px){
            .layout { flex-direction:column; }
            .sidebar { flex:1 1 auto; width:100%; position:sticky; top:64px; z-index:90; order:-1; }
            .sidebar-inner { padding:14px; }
            .content { width:100%; }
            .trip-columns { grid-template-columns:1fr; }
            .filters-grid { flex-direction:column; align-items:stretch; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="brand"><h1>✈️ Consulta de <span>Voos</span> <small style="font-size:0.6rem;color:#4fc3f7;">v8</small></h1></div>
    <div class="api-bar">
        <div class="api-key-wrap">
            <input type="password" id="apiKeyInput" placeholder="Chave GeckoAPI (ex: gck_...)">
            <button class="btn-sm ghost" id="btnSaveKey" type="button">💾 Salvar</button>
            <button class="btn-sm ghost" id="btnTestApi" type="button">🔌 Testar</button>
        </div>
        <span class="api-status" id="apiStatus">⚪ Não configurada</span>
    </div>
</header>

<div class="main">
    <div class="layout">
        <!-- SIDEBAR DE SELEÇÃO -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <h3>🧳 Minha Seleção <span class="sel-count" id="selCount">0</span></h3>
                <div class="sidebar-body" id="sidebarBody">
                    <div class="sidebar-empty">👆 Selecione um voo na lista para acompanhar aqui o resumo da sua viagem.</div>
                </div>
                <div class="sidebar-total" id="sidebarTotal">
                    <span>Total estimado</span>
                    <strong id="sidebarTotalValue">R$ 0,00</strong>
                </div>
                <button class="btn-whatsapp" id="btnWhatsapp" type="button" disabled>💬 WhatsApp</button>
            </div>
        </aside>

        <!-- CONTENT -->
        <div class="content">
            <!-- TIPO DE VIAGEM + REGIÃO -->
            <div class="toggles-row">
                <div class="toggle-group" id="tripTypeBar">
                    <button class="toggle-btn active" data-type="roundtrip" type="button">🔄 Ida e Volta</button>
                    <button class="toggle-btn" data-type="oneway" type="button">➡️ Apenas Ida</button>
                </div>
                <div class="toggle-group" id="regionBar">
                    <button class="toggle-btn active" data-region="nacional" type="button">🇧🇷 Nacional</button>
                    <button class="toggle-btn" data-region="internacional" type="button">🌎 Internacional</button>
                </div>
            </div>

            <!-- FILTROS DE BUSCA (DINHEIRO/PONTOS, CABINE, CIAs) — ACIMA DO FORMULÁRIO -->
            <div class="filters-card">
                <div class="filters-title">⚙️ Preferências de busca</div>
                <div class="filters-grid">
                    <div class="filter-group" id="searchTypeGroup">
                        <button class="filter-btn active" data-type="both" type="button">🔄 Ambos</button>
                        <button class="filter-btn" data-type="money" type="button">💰 Dinheiro</button>
                        <button class="filter-btn" data-type="points" type="button">🎯 Pontos</button>
                    </div>
                    <div class="filter-group" id="cabinFilterGroup">
                        <button class="filter-btn active" data-cabin="all" type="button">🪑 Todas</button>
                        <button class="filter-btn" data-cabin="Econômica" type="button">Econômica</button>
                        <button class="filter-btn" data-cabin="Premium" type="button">Premium</button>
                        <button class="filter-btn" data-cabin="Executiva" type="button">Executiva</button>
                        <button class="filter-btn" data-cabin="Primeira" type="button">Primeira</button>
                    </div>
                    <div class="airline-toggles" id="airlineChips"></div>
                </div>
            </div>

            <!-- FORMULÁRIO DE DATAS E PASSAGEIROS -->
            <div class="search-card">
                <div class="search-row">
                    <div class="search-field">
                        <label>🔵 Origem</label>
                        <div class="airport-box" id="fromSelector">
                            <div class="airport-input-wrap">
                                <input type="text" id="fromAirport" placeholder="Código IATA ou cidade..." autocomplete="off">
                                <button class="clear-btn" type="button">×</button>
                            </div>
                            <div class="airport-dropdown" id="fromDropdown"></div>
                        </div>
                    </div>
                    <div class="search-field">
                        <label>🔴 Destino</label>
                        <div class="airport-box" id="toSelector">
                            <div class="airport-input-wrap">
                                <input type="text" id="toAirport" placeholder="Código IATA ou cidade..." autocomplete="off">
                                <button class="clear-btn" type="button">×</button>
                            </div>
                            <div class="airport-dropdown" id="toDropdown"></div>
                        </div>
                    </div>
                    <div class="search-field">
                        <label>📅 Ida</label>
                        <input type="date" id="depDate">
                    </div>
                    <div class="search-field" id="retDateField">
                        <label>📅 Volta</label>
                        <input type="date" id="retDate">
                    </div>
                    <div class="search-field pax">
                        <label>👤 Adultos</label>
                        <select id="numAdults">

            if(!isNaN(n)) return n;

    }
    return null;
}

/* ─── deepFind: busca recursiva por chave (case-insensitive) ─── */
function deepFind(obj, names, predicate, depth){
    if(depth == null) depth = 0;
    if(depth > 8 || obj == null || typeof obj !== 'object') return null;
    if(Array.isArray(obj)){
        for(var i=0;i<obj.length;i++){
            var r = deepFind(obj[i], names, predicate, depth+1);
            if(r != null) return r;
        }
        return null;
    }
    var keys = Object.keys(obj);
    for(var i=0;i<keys.length;i++){
        var k = keys[i];
        if(names.indexOf(k.toLowerCase()) !== -1){
            var v = obj[k];
            if(v != null && typeof v !== 'object' && (!predicate || predicate(v, k))){
                return v;
            }
        }
    }
    for(var i=0;i<keys.length;i++){
        var r = deepFind(obj[keys[i]], names, predicate, depth+1);
        if(r != null) return r;
    }
    return null;
}

function fmtTime(iso){
    if(!iso) return null;
    var s = String(iso);
    var m = s.match(/T(\d{2}:\d{2})/) || s.match(/(\d{1,2}:\d{2})/);
    return m ? m[1] : null;
}
function fmtDur(d){
    if(!d) return '—';
    var s = String(d);
    var h = s.match(/(\d+)\s*H/i), m = s.match(/(\d+)\s*M(?!in)/i);
    if(h||m) return (h?parseInt(h[1]):0)+'h'+String(m?parseInt(m[1]):0).padStart(2,'0')+'m';
    var hm = s.match(/(\d+):(\d+)/);
    if(hm) return parseInt(hm[1])+'h'+String(parseInt(hm[2])).padStart(2,'0')+'m';
    var mins = parseInt(s);
    if(!isNaN(mins)) return Math.floor(mins/60)+'h'+String(mins%60).padStart(2,'0')+'m';
    return s;
}
function isTimeVal(v){ return typeof v === 'string' && (v.indexOf(':')!==-1 || /T\d{2}:\d{2}/.test(v)); }
function isIataVal(v){ return typeof v === 'string' && /^[A-Za-z]{3}$/.test(v.trim()); }
function isNumVal(v){ return typeof v === 'number' || (typeof v === 'string' && /^\d+(\.\d+)?$/.test(v.trim())); }
function isFlightNumVal(v){ return typeof v === 'string' && /^[A-Za-z0-9]{2,8}$/.test(v.trim()) && /\d/.test(v); }

function extractTime(obj, which){

    var v = deepFind(obj, names, isTimeVal, 0);

}

}

    if(!nums.length){

}

        return aP - bP;

function parseAzul(data, cfg, mode, from, to){
    var f = [];
    if(!data || !data.trips) return f;

        var journeys = trip.journeys || [];

            var fos = [];

            fares.forEach(function(fare){
                var fareCabin = extractCabin(fare) || cabin;
                /* Dinheiro */
                var mon = firstNum([ fare.total&&fare.total.amount, fare.price&&fare.price.amount, fare.amount, fare.total ]);
                if(mon != null){
                    fos.push({ type:'Dinheiro', money:Number(mon), miles:null, costTax:null, cabin:fareCabin });
                }
                /* Pontos / combinação dinheiro + pontos */
                var pointsOptions = fare.pointsOptions || fare.pointsOption || fare.redemptionOptions || [];
                if(!pointsOptions.length && (fare.miles!=null || fare.points!=null)){
                    pointsOptions = [fare];
                }
                pointsOptions.forEach(function(po){
                    var pts = firstNum([ po.amount, po.points, po.miles, po.milesAmount, po.pointsAmount, po.pointsRequired, po.requiredPoints, po.value ]);
                    var cash = firstNum([ po.money, po.cash, po.cashAmount, po.moneyAmount, po.amountMoney, po.payAmount, po.priceAmount, po.cashValue ]);
                    var tax = firstNum([ po.taxes, po.tax, po.fees, po.fee, po.taxAmount, po.totalTaxes ]);
                    if(pts != null || cash != null){
                        var type = (pts != null && cash != null) ? 'Pontos + Dinheiro' : (pts != null ? 'Pontos TudoAzul' : 'Dinheiro');
                        fos.push({ type:type, money: cash!=null?Number(cash):null, miles: pts!=null?Number(pts):null, costTax: tax!=null?Number(tax):null, cabin:fareCabin });
                    }
                });
            });

            if(!fos.length) return;
            var fl = mkFlight(cfg, {
                from: from, to: to,
                dep: extractTime(j,'dep') || extractTime(trip,'dep'),
                arr: extractTime(j,'arr') || extractTime(trip,'arr'),
                dur: extractDuration(j) || extractDuration(trip),
                stops: extractStops(j, segs) || extractStops(trip, segs),
                flightNums: extractFlightNums(j, segs),

                opAirline: alName(carrier), opCode: carrier, opColor: alColor(carrier),
                cabin: cabin, fareOptions: fos

}

                var pts = firstNum([ fr.miles, fr.points, fr.pointsRequired, fr.milesRequired ]);

                if(mon != null || pts != null){
                    var type = (pts != null && mon != null) ? 'Pontos + Dinheiro' : (pts != null ? 'Pontos' : 'Tarifa');
                    fos.push({ type:type, money: mon!=null?Number(mon):null, miles: pts!=null?Number(pts):null, costTax: tax!=null?Number(tax):null, cabin: extractCabin(fr)||itemCabin });
                }
            });
        }
        if(!fos.length){
            var mon = firstNum([ item.price&&(item.price.amount||item.price.total), item.price, item.amount, item.total ]);
            if(mon != null) fos.push({ type:'Tarifa', money:Number(mon), miles:null, costTax:null, cabin:itemCabin });
        }
        if(!fos.length) return;
        var fl = mkFlight(cfg, {
            from: from, to: to,
            dep: extractTime(item,'dep'),
            arr: extractTime(item,'arr'),
            dur: extractDuration(item),
            stops: extractStops(item, segs),
            flightNums: extractFlightNums(item, segs),
            opAirline: alName(carrier), opCode: carrier, opColor: alColor(carrier),
            cabin: itemCabin, fareOptions: fos
        });
        if(fl) f.push(fl);
    });
    return f;
}

function parseLatamPass(data, cfg, mode, from, to){
    return parseLatam(data, cfg, mode, from, to);
}

function parseSmiles(data, cfg, mode, from, to){
    var f = [];
    var offers = data && data.offers ? data.offers : (data && data.items ? data.items : []);
    if(!offers.length && data && data.data && data.data.offers) offers = data.data.offers;
    offers.forEach(function(o){
        var segs = getSegments(o);
        var carrier = getCarrier(segs) || 'G3';
        var cabin = extractCabin(o);
        var fos = [];
        var foList = o.fareOptions || o.fares || [];
        foList.forEach(function(fo){
            var pts = firstNum([ fo.miles, fo.points, fo.pointsRequired, fo.milesRequired, fo.amount ]);
            var mon = firstNum([ fo.money, fo.price&&fo.price.amount, fo.amountMoney ]);
            var tax = firstNum([ fo.taxes, fo.tax, fo.fees, fo.fee ]);
            if(pts != null || mon != null){
                var type = (pts != null && mon != null) ? 'Pontos + Dinheiro' : 'Smiles';
                fos.push({ type:type, money: mon!=null?Number(mon):null, miles: pts!=null?Number(pts):null, costTax: tax!=null?Number(tax):null, cabin: extractCabin(fo)||cabin });
            }
        });
        if(!fos.length){
            var pts = firstNum([ o.miles, o.points, o.pointsRequired ]);
            var mon = firstNum([ o.price&&o.price.amount, o.amountMoney ]);
            if(pts != null || mon != null) fos.push({ type:'Smiles', money: mon!=null?Number(mon):null, miles: pts!=null?Number(pts):null, costTax: null, cabin: cabin });
        }
        if(!fos.length) return;
        var fl = mkFlight(cfg, {
            from: from, to: to,
            dep: extractTime(o,'dep'), arr: extractTime(o,'arr'),
            dur: extractDuration(o), stops: extractStops(o, segs),
            flightNums: extractFlightNums(o, segs),
            opAirline: alName(carrier), opCode: carrier, opColor: alColor(carrier),
            cabin: cabin, fareOptions: fos
        });
        if(fl) f.push(fl);
    });
    return f;
}

function parseGol(data, cfg, mode, from, to){
    var f = [];
    var its = data && data.itineraries ? data.itineraries : (data && data.data && data.data.itineraries ? data.data.itineraries : []);
    its.forEach(function(it){
        var segs = getSegments(it);
        if(!segs.length) return;
        var carrier = getCarrier(segs) || 'G3';
        var cabin = extractCabin(it);
        var fos = [];
        var offers = it.offers || it.fares || [];
        offers.forEach(function(o){
            var mon = firstNum([ o.price&&(o.price.amount||o.price.total), o.price, o.amount, o.total ]);
            if(mon != null) fos.push({ type:o.name||'Tarifa', money:Number(mon), miles:null, costTax:null, cabin: extractCabin(o)||cabin });
        });
        if(!fos.length){
            var mon = firstNum([ it.price, it.total, it.price&&it.price.amount ]);
            if(mon != null) fos.push({ type:'Tarifa', money:Number(mon), miles:null, costTax:null, cabin:cabin });
        }
        if(!fos.length && data.cheapestOffer && data.cheapestOffer.price) fos.push({ type:'Menor Tarifa', money:Number(data.cheapestOffer.price), miles:null, costTax:null, cabin:cabin });
        if(!fos.length) return;
        var fl = mkFlight(cfg, {
            from: from, to: to,
            dep: extractTime(it,'dep'), arr: extractTime(it,'arr'),
            dur: extractDuration(it), stops: extractStops(it, segs),
            flightNums: extractFlightNums(it, segs),
            aircraft: segs[0] ? segs[0].equipment : null,
            opAirline: alName(carrier), opCode: carrier, opColor: alColor(carrier),
            cabin: cabin, fareOptions: fos
        });
        if(fl) f.push(fl);
    });
    return f;
}

function parseData(name, data, cfg, mode, from, to){
    switch(name){
        case 'azul': return parseAzul(data,cfg,mode,from,to);
        case 'latam': return parseLatam(data,cfg,mode,from,to);
        case 'latampass': return parseLatamPass(data,cfg,mode,from,to);
        case 'smiles': return parseSmiles(data,cfg,mode,from,to);
        case 'gol': return parseGol(data,cfg,mode,from,to);
        default: return parseLatam(data,cfg,mode,from,to);
    }
}

/* ============================================================
   CACHE
   ============================================================ */
function cacheKey(params){
    return JSON.stringify({ from:params.from, to:params.to, dep:params.depDate, ret:params.retDate, adults:params.adults, children:params.children, infants:params.infants, searchType:params.searchType, airlines:Object.keys(params.airlines).filter(function(k){return params.airlines[k];}).sort().join(',') });
}
function readCache(params){
    try {
        var store = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        var key = cacheKey(params);
        var entry = store[key];
        if(!entry) return null;
        if(Date.now() > entry.expiresAt){ delete store[key]; localStorage.setItem(CACHE_KEY, JSON.stringify(store)); log('⏰ Cache expirado'); return null; }
        log('💾 Cache encontrado — válido até '+new Date(entry.expiresAt).toLocaleTimeString());
        return entry;
    } catch(e){ log('⚠️ Erro ao ler cache: '+e.message); return null; }
}
function writeCache(params, data){
    try {
        var store = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
        store[cacheKey(params)] = { data:data, savedAt:Date.now(), expiresAt:Date.now()+CACHE_TTL_MS };
        var keys = Object.keys(store).sort(function(a,b){ return store[b].savedAt - store[a].savedAt; });
        if(keys.length > CACHE_MAX_ENTRIES){ keys.slice(CACHE_MAX_ENTRIES).forEach(function(k){ delete store[k]; }); }
        localStorage.setItem(CACHE_KEY, JSON.stringify(store));
        log('💾 Cache salvo — TTL '+Math.round(CACHE_TTL_MS/60000)+' min');
    } catch(e){ log('⚠️ Erro ao salvar cache: '+e.message); }
}
function showCacheBadge(entry){
    var el = $('cacheBadge');
    var min = Math.round((Date.now() - entry.savedAt) / 60000);
    var remaining = Math.round((entry.expiresAt - Date.now()) / 60000);
    el.className = 'cache-badge show cached';
    el.innerHTML = '💾 <strong>Resultados em cache</strong> — consultados há '+min+' min · expira em '+remaining+' min'+
        ' <button class="btn-refresh" onclick="window._forceRefresh=true;document.getElementById(\'btnSearch\').click();" type="button">🔄 Atualizar agora</button>';
}
function showFreshBadge(){
    var el = $('cacheBadge');
    el.className = 'cache-badge show fresh';
    el.innerHTML = '🔄 <strong>Resultados atualizados</strong> — consulta direta à GeckoAPI · expira em '+Math.round(CACHE_TTL_MS/60000)+' min';
}
function hideCacheBadge(){ $('cacheBadge').className = 'cache-badge'; }

   CIAS ATIVAS + TASKS
   ============================================================ */
function getActive(){
    var list = [];
    Object.keys(state.selected).forEach(function(id){
        if(!state.selected[id]) return;
        var c = AIRLINES[id]; if(!c) return;
        if(c.region !== 'both' && c.region !== state.region) return;
        if(state.searchType === 'money' && !c.canMoney) return;
        if(state.searchType === 'points' && !c.canPoints) return;
        list.push(c);
    });
    return list;
}
function buildTasks(from,to,depDate,adults,children,infants){
    var tasks = [];
    var dirs = state.tripType === 'roundtrip' ? ['ida','volta'] : ['ida'];
    getActive().forEach(function(cfg){
        dirs.forEach(function(dir){
            var date = (dir==='volta') ? $('retDate').value : depDate;
            var origin = (dir==='volta') ? to : from;
            var dest = (dir==='volta') ? from : to;
            if(!date) return;
            var modesToCall = [];
            if(state.searchType === 'both'){ modesToCall = cfg.modes || ['money']; }
            else if(state.searchType === 'money' && cfg.canMoney){ modesToCall = ['money']; }
            else if(state.searchType === 'points' && cfg.canPoints){ modesToCall = ['points']; }
            modesToCall.forEach(function(mode){
                tasks.push({ target:cfg, payload:cfg.build(origin,dest,date,adults,children,infants,mode), direction:dir, mode:mode });
            });
        });
    });
    return tasks;
}
function getIata(which){
    var el = $(which==='from'?'fromAirport':'toAirport');
    var v = el.value.trim(); if(!v) return null;
    var m = v.match(/^([A-Z]{3})\b/);
    return m ? m[1] : v.toUpperCase().replace(/[^A-Z]/g,'').substring(0,3) || null;
}

/* ============================================================
   API
   ============================================================ */
async function apiCall(task){
    var cfg = task.target;
    var payload = task.payload;
    var label = cfg.label + (task.mode==='points'?' 🎯':' 💰');
    log('📡 '+label+' → target='+payload.target+' | payload='+JSON.stringify(payload));
    var resp = await fetch(GECKO_API, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+state.apiKey },
        body: JSON.stringify(payload)
    });
    var text = await resp.text();
    if(!resp.ok){ log('❌ '+label+' HTTP '+resp.status+': '+text.substring(0,300)); throw new Error(label+' HTTP '+resp.status); }
    var json;
    try { json = JSON.parse(text); } catch(e){ log('❌ '+label+' JSON inválido: '+text.substring(0,200)); throw new Error(label+' resposta inválida'); }
    log('📥 '+label+' ← status='+resp.status+' | notFound='+(json.notFound===true)+' | dataIsNull='+(json.data==null)+' | keys='+(json.data?Object.keys(json.data).join(','):'null'));
    if(DEBUG && json.data) log('🔬 '+label+' data sample: '+JSON.stringify(json.data).substring(0,600));
    if(json.notFound === true || json.data === null){ log('📭 '+label+' → notFound'); return { notFound:true, data:null, direction:task.direction, target:cfg, mode:task.mode }; }
    log('✅ '+label+' → OK');
    return { notFound:false, data:json.data, direction:task.direction, target:cfg, mode:task.mode };
}

async function searchAll(from,to,depDate,adults,children,infants){
    var tasks = buildTasks(from,to,depDate,adults,children,infants);
    if(!tasks.length) throw new Error('Nenhuma cia compatível selecionada');
    log('🔀 Total de '+tasks.length+' chamada(s) para a GeckoAPI...');
    var settled = await Promise.allSettled(tasks.map(function(t){ return apiCall(t); }));
    var flights = { ida:[], volta:[] };
    var errors = [];
    settled.forEach(function(r){
        if(r.status === 'rejected'){ errors.push({direction:'?',label:'API',reason:r.reason?r.reason.message:String(r.reason)}); log('💥 Rejeitada: '+(r.reason?r.reason.message:String(r.reason))); return; }
        var val = r.value;
        if(val.notFound){ errors.push({direction:val.direction,label:val.target.label+(val.mode==='points'?' 🎯':' 💰'),reason:'Rota indisponível'}); return; }
        try {
            var parsed = parseData(val.target.parser, val.data, val.target, val.mode, from, to);
            log('📊 '+val.target.label+' '+val.direction+' ('+val.mode+'): '+parsed.length+' voo(s)');
            flights[val.direction] = flights[val.direction].concat(parsed);
        } catch(e){ errors.push({direction:val.direction,label:val.target.label,reason:'Parse: '+e.message}); log('⚠️ Parse error '+val.target.label+': '+e.message); }
    });
    return { flights:flights, errors:errors };
}

function getFlightSortValue(f){
    var fo = f.fareOptions && f.fareOptions[0];
    if(!fo) return Infinity;
    if(state.searchType === 'money') return fo.money != null ? fo.money : Infinity;
    if(state.searchType === 'points') return fo.miles != null ? fo.miles : Infinity;
    if(fo.money != null) return fo.money;
    if(fo.miles != null) return 1000000000 + fo.miles;
    return Infinity;
}
function sortFlights(list){ list.sort(function(a,b){ return getFlightSortValue(a) - getFlightSortValue(b); }); }

/* --- Aeroportos --- */
function initAirports(){
    ['from','to'].forEach(function(type){
        var input = $(type+'Airport'), wrap = input.parentElement, dd = $(type+'Dropdown'), clr = wrap.querySelector('.clear-btn');
        input.addEventListener('input', function(){ filterAp(type); });
        input.addEventListener('focus', function(){ filterAp(type); setTimeout(function(){ dd.classList.add('show'); }, 50); });
        input.addEventListener('blur', function(){ setTimeout(function(){ dd.classList.remove('show'); }, 180); });
        clr.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); input.value=''; wrap.classList.remove('has-value'); dd.classList.remove('show'); input.focus(); });
    });
    document.addEventListener('click', function(e){
        if(!e.target.closest('.airport-box')){ $('fromDropdown').classList.remove('show'); $('toDropdown').classList.remove('show'); }
    });
}
function filterAp(type){
    var input = $(type+'Airport'), wrap = input.parentElement, dd = $(type+'Dropdown'), q = input.value.trim();
    wrap.classList.toggle('has-value', !!q);
    var aps = AIRPORTS[state.region] || AIRPORTS.nacional;
    if(type==='from' && state.region==='internacional') aps = AIRPORTS.nacional.concat(AIRPORTS.internacional);
    var qu = q.toUpperCase();
    var filt = !qu ? aps : aps.filter(function(a){ return a.iata.indexOf(qu)!==-1 || a.city.toUpperCase().indexOf(qu)!==-1 || a.name.toUpperCase().indexOf(qu)!==-1; });
    var h = filt.length===0 ? '<div class="no-results">Nenhum aeroporto</div>' : '<div class="airport-dropdown-header">'+filt.length+' aeroportos</div>';
    if(filt.length>0){ filt.slice(0,25).forEach(function(ap){ h += '<div class="airport-item" data-iata="'+ap.iata+'" data-type="'+type+'"><span class="iata">'+ap.iata+'</span><div class="info"><div class="city">'+ap.city+'</div><div class="name">'+ap.name+'</div></div></div>'; }); }
    dd.innerHTML = h;
    dd.querySelectorAll('.airport-item').forEach(function(it){
        it.addEventListener('mousedown', function(e){
            e.preventDefault();
            var iata = it.dataset.iata, t = it.dataset.type;
            var ap = aps.find(function(a){return a.iata===iata;});
            $(t+'Airport').value = iata+' - '+(ap?ap.city:'');
            $(t+'Airport').parentElement.classList.add('has-value');
            dd.classList.remove('show');
        });
    });
    dd.classList.add('show');
}

function filterByCabin(list){

function colHtml(dir,label,flights){

        if(best.points != null) h += '<span class="best-chip points"><span class="lbl">Melhor 🎯</span> '+fmtPts(best.points)+'</span>';

        h += '<div class="times">🕒 '+(f.dep||'--:--')+' → '+(f.arr||'--:--')+' · '+f.dur+'</div>';
        h += '<div class="tags">';
        h += f.stops===0?'<span class="badge badge-direct">Direto</span>':'<span class="badge badge-stops">'+f.stops+' parada'+(f.stops>1?'s':'')+'</span>';

        h += '</div>';

            h += '<table class="fare-table"><tr><th>Tarifa</th><th>Classe</th><th>Preço</th><th>Pontos</th><th>Taxa</th></tr>';
            f.fareOptions.forEach(function(fo,idx){
                var bestF = idx===0;
                h += '<tr'+(bestF?' class="best-fare"':'')+'>';
                h += '<td>'+fo.type+'</td><td>'+(fo.cabin||f.cabin)+'</td><td>'+(fo.money!=null?fmtBRL(fo.money):'—')+'</td><td>'+(fo.miles!=null?fmtPts(fo.miles):'—')+'</td><td>'+(fo.costTax!=null?fmtBRL(fo.costTax):'—')+'</td></tr>';

    });
    h += '</div></div>';
    return h;
}
function selectFlight(dir,flightId){
    if(dir==='ida') state.selIda = (state.selIda===flightId?null:flightId);
    else state.selVolta = (state.selVolta===flightId?null:flightId);

function findFlight(dir,id){
    if(!id) return null;
    var all = state.flights[dir] || [];
    for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i];

}

        return '<div class="sel-card selected-'+dir+'">'+
            '<div class="sel-head"><span class="sel-dir '+dir+'">'+label+'</span>'+
            '<button class="sel-remove" data-dir="'+dir+'" title="Remover">×</button></div>'+
            '<div class="sel-route">'+f.opAirline+' · '+f.from+' → '+f.to+'</div>'+
            '<div class="sel-times">🕒 '+(f.dep||'--:--')+' → '+(f.arr||'--:--')+' · '+f.dur+'</div>'+
            '<div class="sel-tags"><span class="cabin-tag">🪑 '+f.cabin+'</span>'+
            (f.stops===0?'<span class="badge badge-direct">Direto</span>':'<span class="badge badge-stops">'+f.stops+' parada'+(f.stops>1?'s':'')+'</span>')+
            '</div>'+priceHtml+taxHtml+'</div>';
    }

    var html = '';
    if(idaFlight) html += cardHtml('ida','🟢 IDA',idaFlight);
    if(voltaFlight) html += cardHtml('volta','🔴 VOLTA',voltaFlight);
    body.innerHTML = html;

    body.querySelectorAll('.sel-remove').forEach(function(btn){
        btn.addEventListener('click', function(e){
            e.stopPropagation();
            var dir = btn.dataset.dir;
            if(dir==='ida') state.selIda = null; else state.selVolta = null;
            renderResults();
        });
    });

    /* Totais */
    var foList = [];
    if(idaFlight) foList.push(idaFlight.fareOptions[0]);
    if(voltaFlight) foList.push(voltaFlight.fareOptions[0]);
    var moneyVals = foList.map(function(fo){return fo.money;}).filter(function(v){return v!=null;});
    var pointsVals = foList.map(function(fo){return fo.miles;}).filter(function(v){return v!=null;});

    if(moneyVals.length === foList.length && pointsVals.length === 0){
        totalVal.textContent = fmtBRL(moneyVals.reduce(function(a,b){return a+b;},0));
        totalVal.style.color = '#0d8a3e';
    } else if(pointsVals.length === foList.length && moneyVals.length === 0){
        totalVal.textContent = fmtPts(pointsVals.reduce(function(a,b){return a+b;},0));
        totalVal.style.color = '#6B2D8B';
    } else {
        var sumM = moneyVals.reduce(function(a,b){return a+b;},0);
        var sumPt = pointsVals.reduce(function(a,b){return a+b;},0);
        totalVal.textContent = (sumM?fmtBRL(sumM)+' + ':'')+(sumPt?fmtPts(sumPt):'');
        totalVal.style.color = '#0d8a3e';
    }
    totalWrap.classList.add('visible');
    waBtn.disabled = false;
}

/* ============================================================
   WHATSAPP
   ============================================================ */
function buildWhatsappMsg(){
    var lines = ['✈️ *Cotação de Voos*',''];
    var from = $('fromAirport').value, to = $('toAirport').value;
    var dep = $('depDate').value, ret = $('retDate').value;
    var adults = $('numAdults').value, children = $('numChildren').value, infants = $('numInfants').value;

    lines.push('📍 '+from+' → '+to);
    lines.push('📅 Ida: '+fmtDateBR(dep)+(state.tripType==='roundtrip'?' | Volta: '+fmtDateBR(ret):''));
    lines.push('👥 '+adults+' adulto(s), '+children+' criança(s), '+infants+' bebê(s)');
    lines.push('');

    function addFlight(symbol, dir, id){
        var f = findFlight(dir, id);
        if(!f) return;
        var fo = f.fareOptions[0];
        lines.push(symbol+' *'+dir.toUpperCase()+'*');
        lines.push(f.opAirline+' · '+f.from+' → '+f.to);
        lines.push('🕒 '+(f.dep||'--:--')+' → '+(f.arr||'--:--')+' · '+f.dur);
        lines.push('🪑 '+f.cabin+' · '+(f.stops===0?'Direto':f.stops+' parada(s)')+(f.flightNums.length?' · '+f.flightNums.join(', '):''));
        if(fo){
            if(fo.money != null) lines.push('💰 '+fmtBRL(fo.money));
            if(fo.miles != null) lines.push('🎯 '+fmtPts(fo.miles));
            if(fo.costTax != null) lines.push('🧾 Taxas: '+fmtBRL(fo.costTax));
        }
        lines.push('');
    }

    addFlight('🟢', 'ida', state.selIda);
    addFlight('🔴', 'volta', state.selVolta);

    /* Total */
    var foList = [];
    var idaF = findFlight('ida', state.selIda);
    var voltaF = findFlight('volta', state.selVolta);
    if(idaF) foList.push(idaF.fareOptions[0]);
    if(voltaF) foList.push(voltaF.fareOptions[0]);
    var moneyVals = foList.map(function(fo){return fo.money;}).filter(function(v){return v!=null;});
    var pointsVals = foList.map(function(fo){return fo.miles;}).filter(function(v){return v!=null;});
    if(moneyVals.length || pointsVals.length){
        var total = [];
        if(moneyVals.length) total.push(fmtBRL(moneyVals.reduce(function(a,b){return a+b;},0)));
        if(pointsVals.length) total.push(fmtPts(pointsVals.reduce(function(a,b){return a+b;},0)));
        lines.push('💵 *Total:* '+total.join(' + '));
    }
    return lines.join('\n');
}

/* ============================================================
   MAIN SEARCH
   ============================================================ */
async function doSearch(forceRefresh){
    var from = getIata('from'), to = getIata('to');
    var depDate = $('depDate').value;
    var adults = parseInt($('numAdults').value)||1;
    var children = parseInt($('numChildren').value)||0;
    var infants = parseInt($('numInfants').value)||0;

    if(!from){ toast('⚠️ Informe a origem'); return; }
    if(!to){ toast('⚠️ Informe o destino'); return; }
    if(!depDate){ toast('⚠️ Informe a data de ida'); return; }
    if(!state.apiKey){ toast('⚠️ Configure a chave da API'); return; }

    var retDate = state.tripType==='roundtrip' ? $('retDate').value : null;
    if(state.tripType==='roundtrip' && !retDate){ toast('⚠️ Informe a data de volta'); return; }

    var params = { from:from, to:to, depDate:depDate, retDate:retDate, adults:adults, children:children, infants:infants, searchType:state.searchType, airlines:state.selected };

    state.selIda = null; state.selVolta = null;

    if(!forceRefresh){
        var cached = readCache(params);
        if(cached){
            state.flights = cached.data.flights;
            state.errors = cached.data.errors || [];
            state.lastSearchParams = params;
            showCacheBadge(cached);
            sortFlights(state.flights.ida);
            sortFlights(state.flights.volta);
            renderResults();
            toast('💾 Resultados do cache');
            return;
        }
    }

    $('btnSearch').disabled = true;
    $('loadingBox').classList.add('show');
    $('loadingText').textContent = 'Buscando voos...';
    $('resultsSection').classList.remove('visible');
    hideCacheBadge();
    state.errors = [];
    state.logs = [];

    try {
        var result = await searchAll(from, to, depDate, adults, children, infants);
        state.flights = result.flights;
        state.errors = result.errors;
        state.lastSearchParams = params;
        sortFlights(state.flights.ida);
        sortFlights(state.flights.volta);
        writeCache(params, { flights: state.flights, errors: state.errors });
        showFreshBadge();
        renderResults();
        var total = state.flights.ida.length + state.flights.volta.length;
        toast('✅ '+total+' voo(s) encontrado(s)');
    } catch(e){
        log('💥 Erro geral: '+e.message);
        toast('❌ '+e.message);
    } finally {
        $('btnSearch').disabled = false;
        $('loadingBox').classList.remove('show');
    }
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
    if(state.apiKey){ $('apiKeyInput').value = state.apiKey; setApiStatus('configured'); }

    $('btnSaveKey').addEventListener('click', function(){
        var v = $('apiKeyInput').value.trim();
        if(!v){ localStorage.removeItem('geckoApiKey'); state.apiKey=''; setApiStatus('empty'); toast('Chave removida'); return; }
        state.apiKey = v; localStorage.setItem('geckoApiKey', v); setApiStatus('configured'); toast('💾 Chave salva');
    });

    $('btnTestApi').addEventListener('click', async function(){
        if(!state.apiKey){ toast('⚠️ Salve a chave primeiro'); return; }
        setApiStatus('testing');
        try { await testConnection(); setApiStatus('ok'); toast('✅ API conectada'); }
        catch(e){ setApiStatus('error'); toast('❌ '+e.message); }
    });

    $('tripTypeBar').addEventListener('click', function(e){
        var btn = e.target.closest('.toggle-btn'); if(!btn) return;
        $('tripTypeBar').querySelectorAll('.toggle-btn').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active');
        state.tripType = btn.dataset.type;
        applyTripUI(); updateStatus();
    });

    $('regionBar').addEventListener('click', function(e){
        var btn = e.target.closest('.toggle-btn'); if(!btn) return;
        $('regionBar').querySelectorAll('.toggle-btn').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active');
        state.region = btn.dataset.region;
        renderChips(); updateStatus();
    });

    $('searchTypeGroup').addEventListener('click', function(e){
        var btn = e.target.closest('.filter-btn'); if(!btn) return;
        $('searchTypeGroup').querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active');
        state.searchType = btn.dataset.type;
        renderChips(); updateStatus();
    });

    $('cabinFilterGroup').addEventListener('click', function(e){
        var btn = e.target.closest('.filter-btn'); if(!btn) return;
        $('cabinFilterGroup').querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active');
        state.cabinFilter = btn.dataset.cabin;
        updateStatus(); renderResults();
    });

    $('btnSearch').addEventListener('click', function(){
        doSearch(window._forceRefresh || false);
        window._forceRefresh = false;
    });

    $('debugToggle').addEventListener('click', function(){
        var p = $('debugPanel');
        p.classList.toggle('on');
        if(p.classList.contains('on')) p.textContent = state.logs.slice(-80).join('\n');
    });

    $('btnWhatsapp').addEventListener('click', function(){
        var msg = buildWhatsappMsg();
        $('msgPreview').textContent = msg;
        $('btnSendWa').href = 'https://wa.me/?text='+encodeURIComponent(msg);
        $('whatsappModal').classList.add('show');
    });

    $('btnCopy').addEventListener('click', function(){
        navigator.clipboard.writeText($('msgPreview').textContent).then(function(){ toast('📋 Copiado!'); });
    });

    $('btnCloseModal').addEventListener('click', function(){ $('whatsappModal').classList.remove('show'); });
    $('whatsappModal').addEventListener('click', function(e){ if(e.target === $('whatsappModal')) $('whatsappModal').classList.remove('show'); });

    initAirports();
    renderChips();
    updateStatus();
    applyTripUI();
    renderSidebar();

    var today = new Date();
    var dep = new Date(today); dep.setDate(dep.getDate()+7);
    var ret = new Date(today); ret.setDate(ret.getDate()+14);
    $('depDate').value = dep.toISOString().split('T')[0];
    $('retDate').value = ret.toISOString().split('T')[0];

    log('🚀 App iniciada — v8');
}

init();

})();
</script>
